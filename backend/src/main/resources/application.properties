spring.application.name=appetit
spring.datasource.url=jdbc:sqlite:${APPETIT_DB_PATH:appetit.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
appetit.taxa-entrega-centavos=1000
appetit.status-automatico.habilitado=true
appetit.status-automatico.segundos-por-etapa=20
appetit.status-automatico.intervalo-ms=5000
